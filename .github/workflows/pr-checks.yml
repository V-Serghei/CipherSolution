name: PR Checks

on:
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CipherSolution.sln

      - name: Build
        run: dotnet build CipherSolution.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CipherSolution.sln --configuration Release --no-build --verbosity normal
